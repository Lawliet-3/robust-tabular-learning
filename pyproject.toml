[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "robust-tabular-learning"
version = "0.1.0"
description = "A reproducible benchmark of tree ensembles, neural networks, and pretrained tabular models under realistic data stressors."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Kaung Khant Kyaw" }]
dependencies = [
  "joblib>=1.4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyyaml>=6.0",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
trees = ["xgboost>=2.1", "lightgbm>=4.5", "catboost>=1.2"]
neural = ["torch>=2.4"]
pretrained = ["tabpfn>=6,<9"]
all = [
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "catboost>=1.2",
  "torch>=2.4",
  "tabpfn>=6,<9",
]
dev = ["matplotlib>=3.9", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
robust-tabular = "robust_tabular.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robust_tabular"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
