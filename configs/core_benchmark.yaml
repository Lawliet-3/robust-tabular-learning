seed: 42
test_size: 0.2
repeats: 3
output_dir: results/core
resume: true
generate_report: true

models:
  - xgboost
  - lightgbm
  - catboost
  - ft_transformer
  - tabpfn

scenarios:
  - standard
  - low_data
  - missingness
  - covariate_shift

# One representative severity per stressor keeps the core study to 180 fits.
low_data_fractions: [0.25]
missingness_rates: [0.3]

datasets:
  - {name: credit-g, openml_id: 31, task: classification}
  - {name: spambase, openml_id: 44, task: classification}
  - {name: kin8nm, openml_id: 189, task: regression}

model_params:
  xgboost: {n_estimators: 300, max_depth: 6, learning_rate: 0.05}
  lightgbm: {n_estimators: 300, num_leaves: 31, learning_rate: 0.05}
  catboost: {iterations: 300, depth: 6, learning_rate: 0.05}
  ft_transformer:
    {d_token: 32, n_heads: 4, n_layers: 2, epochs: 30, batch_size: 128}
  tabpfn: {}
